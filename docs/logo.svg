<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="cor-logo-title">
  <title id="cor-logo-title">Corridor Logo</title>
  <defs>
    <linearGradient id="cor-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B2C"/>
      <stop offset="1" stop-color="#0A0E1A"/>
    </linearGradient>
    <linearGradient id="cor-track-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#9D7BFF"/>
    </linearGradient>
    <linearGradient id="cor-track-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DD7E36"/>
      <stop offset="1" stop-color="#FF5DBA"/>
    </linearGradient>
    <pattern id="cor-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#cor-bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#cor-grid)"/>
  <!-- Outer infrastructure frame corners -->
  <path d="M26 38V26H38M90 26H102V38M26 90V102H38M90 102H102V90" fill="none" stroke="#4697B1" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Three corridor tracks matching in-app Logo geometry -->
  <line x1="28" y1="44" x2="100" y2="44" stroke="url(#cor-track-1)" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="28" y1="64" x2="100" y2="64" stroke="url(#cor-track-2)" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="28" y1="84" x2="100" y2="84" stroke="url(#cor-track-1)" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Logistic & crew nodes on tracks -->
  <circle cx="46" cy="44" r="7.5" fill="#0A0E1A" stroke="#22D3EE" stroke-width="3.5"/>
  <circle cx="84" cy="64" r="7.5" fill="#0A0E1A" stroke="#DD7E36" stroke-width="3.5"/>
  <circle cx="56" cy="84" r="7.5" fill="#0A0E1A" stroke="#9D7BFF" stroke-width="3.5"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
</svg>

