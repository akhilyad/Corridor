<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="ttl">
  <title id="ttl">Corridor — supply-and-compliance marketplace for European energy &amp; data-center EPC crews</title>
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="0.5" stop-color="#edeef2"/>
      <stop offset="1" stop-color="#e2e6ec"/>
    </linearGradient>
    <linearGradient id="neonL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="seaL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7c97"/>
      <stop offset="1" stop-color="#4697b1"/>
    </linearGradient>
    <filter id="softL" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="gridL" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#c8cdd8" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bgL)"/>
  <rect width="1200" height="320" fill="url(#gridL)" opacity="0.6"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="url(#seaL)" stroke-width="3" stroke-linecap="square">
    <path d="M24 70 V28 H70"/>
    <path d="M1176 70 V28 H1130"/>
    <path d="M24 250 V292 H70"/>
    <path d="M1176 250 V292 H1130"/>
  </g>

  <!-- kicker -->
  <text x="600" y="74" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="3" fill="#2f7c97">› WORKFORCE-HOUSING  ∩  SITE-LOGISTICS  ∩  COMPLIANCE-ANCHORED</text>

  <!-- divider -->
  <line x1="430" y1="98" x2="770" y2="98" stroke="url(#seaL)" stroke-width="2"/>

  <!-- wordmark: soft glow + crisp neon-gradient core -->
  <g text-anchor="middle" font-weight="800" letter-spacing="4">
    <text x="600" y="206" font-size="172" fill="url(#neonL)" opacity="0.25" filter="url(#softL)">CORRIDOR</text>
    <text x="600" y="206" font-size="172" fill="url(#neonL)">CORRIDOR</text>
  </g>

  <!-- subtitle -->
  <text x="600" y="248" text-anchor="middle" font-size="21" letter-spacing="1.5" fill="#4e586a">THE SUPPLY-AND-COMPLIANCE MARKETPLACE FOR EUROPEAN ENERGY × DATA-CENTER EPC CREWS</text>

  <!-- status strip -->
  <text x="600" y="292" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1" fill="#818b9f">// 600 crew × 9 mo × €1.4k  ─▶  €7.56M gross  ─▶  ~€983K corridor take  //</text>
</svg>
