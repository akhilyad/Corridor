<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="ttl">
  <title id="ttl">Corridor — supply-and-compliance marketplace for European energy & data-center EPC crews</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.6" stop-color="#11151f"/>
      <stop offset="1" stop-color="#161b2c"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#9d7bff"/>
      <stop offset="1" stop-color="#ff5dba"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46e8ff"/>
      <stop offset="1" stop-color="#4697b1"/>
    </linearGradient>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="tight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="lineglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d2230" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.55"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="square" filter="url(#lineglow)">
    <path d="M24 70 V28 H70"/>
    <path d="M1176 70 V28 H1130"/>
    <path d="M24 250 V292 H70"/>
    <path d="M1176 250 V292 H1130"/>
  </g>

  <!-- kicker -->
  <text x="600" y="74" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="3" fill="#46e8ff" opacity="0.85">› WORKFORCE-HOUSING  ∩  SITE-LOGISTICS  ∩  COMPLIANCE-ANCHORED</text>

  <!-- divider -->
  <line x1="430" y1="98" x2="770" y2="98" stroke="url(#sea)" stroke-width="2" filter="url(#lineglow)"/>

  <!-- wordmark: halo + tight glow + bright core -->
  <g text-anchor="middle" font-weight="800" letter-spacing="4">
    <text x="600" y="206" font-size="172" fill="url(#neon)" opacity="0.45" filter="url(#halo)">CORRIDOR</text>
    <text x="600" y="206" font-size="172" fill="url(#neon)" opacity="0.9" filter="url(#tight)">CORRIDOR</text>
    <text x="600" y="206" font-size="172" fill="#ffffff" opacity="0.97">CORRIDOR</text>
  </g>

  <!-- subtitle -->
  <text x="600" y="248" text-anchor="middle" font-size="21" letter-spacing="1.5" fill="#aeb5c2">THE SUPPLY-AND-COMPLIANCE MARKETPLACE FOR EUROPEAN ENERGY × DATA-CENTER EPC CREWS</text>

  <!-- status strip -->
  <text x="600" y="292" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="1" fill="#636e84">// 600 crew × 9 mo × €1.4k  ─▶  €7.56M gross  ─▶  ~€983K corridor take  //</text>
</svg>
